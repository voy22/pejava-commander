name: Feature request / Предложение
description: An idea for the app or the plugin API / Идея для программы или API плагинов
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do? / Что вы хотите сделать?
      description: The task, not the solution — it helps to find the best way. / Опишите задачу, а не решение — так проще найти лучший вариант.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work? / Как это могло бы работать?
  - type: dropdown
    id: area
    attributes:
      label: Area / Область
      options:
        - Panels and views / Панели и режимы
        - File operations / Операции с файлами
        - Archives / Архивы
        - Network / Сеть
        - Terminal / Терминал
        - Settings, keys, colors / Настройки, клавиши, цвета
        - Plugin API / API плагинов
        - Other / Другое
