name: Feature request
description: An idea for the app or the plugin API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task, not the solution — it helps to find the best way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Panels and views
        - File operations
        - Archives
        - Network
        - Terminal
        - Settings, keys, colors
        - Plugin API
        - Other
