name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
      placeholder: |
        1. Open a .zip with Enter
        2. Press F5 to copy a file out
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PejavaCommander version
      description: The version you downloaded, as in the file name (PejavaCommander-0.1.0-…).
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Windows ARM64
        - Linux x64
        - Linux ARM64
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and shell
      placeholder: macOS 26.0, zsh
  - type: textarea
    id: plugins
    attributes:
      label: Plugins you installed
      description: Plugins not built into the app, if any (Plugin Manager, ⌘⇧X).
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, errors
      description: Drag images here. Error text from notifications or DevTools (⌘⌥I / Ctrl+Shift+I).
